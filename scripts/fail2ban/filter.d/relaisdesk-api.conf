# Fail2ban filter for RelaisDesk API
# Detects repeated authentication failures (401, 403) and rate-limit bans (429)
[Definition]
failregex = ^.+ (?:POST|GET|PUT|DELETE) /api/v1/(?:admin|technician|customer|viewer)/.* - (?:401|403|429) - .+ - IP: <HOST>$
            ^.+ (?:POST|GET|PUT|DELETE) /api/v1/(?:activate|validate).* - (?:401|403|429) - .+ - IP: <HOST>$

# Ignore loopback connections
ignoreregex = ^.+ - IP: (?:127\.0\.0\.1|::1)$
