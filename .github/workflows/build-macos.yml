name: Build RelaisDesk macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de RelaisDesk (ex: 1.0.0)'
        required: true
        default: '1.0.0'
      repackage_run_id:
        description: 'Vérifier uniquement les métadonnées des DMG d’une compilation terminée'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos:
    if: ${{ inputs.repackage_run_id == '' }}
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min_macos }}
    strategy:
      matrix:
        include:
          - arch: aarch64-apple-darwin
            runner: macos-15
            min_macos: '12.3'
            target: aarch64-apple-darwin
            rustdesk_target: aarch64-apple-darwin
            goarch: arm64
            dmg_suffix: ""
          - arch: x86_64-apple-darwin
            runner: macos-15-intel
            min_macos: '12.0'
            target: x86_64-apple-darwin
            rustdesk_target: x86_64-apple-darwin
            goarch: amd64
            dmg_suffix: "_Intel"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Clone RelaisDesk client fork
        run: |
          git init rustdesk
          git -C rustdesk remote add origin https://github.com/JuLeXoGame/relaisdesk.git
          git -C rustdesk fetch --depth 1 origin 1054d0f09e4e1d4aaea1309af714289e6055ba4b
          git -C rustdesk checkout --detach FETCH_HEAD
          git -C rustdesk submodule update --init --recursive --depth 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Install macOS build tools
        run: |
          brew install create-dmg llvm
          if ! command -v pkg-config >/dev/null; then brew install pkg-config; fi
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          curl -fsSL https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip -o "$RUNNER_TEMP/nasm.zip"
          echo "074ea8479929d48cfb00cc8d7660129dc69f9d92b63e45c9ce861b478f1d201ce70abac5c87dc7ad8e7f9f46be48f57998ef45897f80d5f9a4737827783ad794  $RUNNER_TEMP/nasm.zip" | shasum -a 512 -c -
          unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nasm-2.16.03" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'

      - name: Apply the fork's Flutter compatibility patch
        run: |
          sdk="$(dirname "$(dirname "$(command -v flutter)")")"
          git -C "$sdk" apply "$GITHUB_WORKSPACE/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Setup native dependencies
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
          vcpkgJsonGlob: rustdesk/vcpkg.json
          doNotCache: true

      - name: Install native dependencies
        working-directory: rustdesk
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet "${{ matrix.goarch == 'arm64' && 'arm64-osx' || 'x64-osx' }}" --x-install-root="$VCPKG_ROOT/installed"

      - name: Verify AV1 SVC security bounds
        run: |
          native="$VCPKG_ROOT/installed/${{ matrix.goarch == 'arm64' && 'arm64-osx' || 'x64-osx' }}"
          clang tests/aom_svc_bounds.c -I"$native/include" "$native/lib/libaom.a" -lc++ -o "$RUNNER_TEMP/aom-svc-test"
          "$RUNNER_TEMP/aom-svc-test"

      - name: Generate Flutter bridge
        working-directory: rustdesk
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          cd flutter
          flutter pub get
          cd ..
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file rustdesk/Cargo.lock

      - name: Build RustDesk Core for macOS
        run: |
          cd rustdesk
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          minimum = os.environ["MACOSX_DEPLOYMENT_TARGET"]
          p = Path("flutter/macos/Podfile")
          p.write_text(re.sub(r"platform :osx, '[^']+'", f"platform :osx, '{minimum}'", p.read_text()))
          p = Path("flutter/macos/Runner.xcodeproj/project.pbxproj")
          p.write_text(re.sub(r"MACOSX_DEPLOYMENT_TARGET = [0-9.]+;", f"MACOSX_DEPLOYMENT_TARGET = {minimum};", p.read_text()))
          PY
          cargo build --locked --release --features flutter
          cp target/release/liblibrustdesk.dylib target/release/librustdesk.dylib
          cd flutter
          FLUTTER_XCODE_ARCHS="${{ matrix.goarch == 'arm64' && 'arm64' || 'x86_64' }}" FLUTTER_XCODE_ONLY_ACTIVE_ARCH=YES flutter build macos --release

      - name: Verify RustDesk payload
        run: |
          set -euo pipefail
          apps=( "$PWD"/rustdesk/flutter/build/macos/Build/Products/Release/*.app )
          test "${#apps[@]}" -eq 1
          engine_app="${apps[0]}"
          test -d "$engine_app"
          cp rustdesk/target/release/service "$engine_app/Contents/MacOS/service"
          test -f "$engine_app/Contents/Frameworks/liblibrustdesk.dylib"
          test -d "$engine_app/Contents/Frameworks"
          codesign --force --deep --sign - "$engine_app"
          codesign --verify --deep --strict "$engine_app"
          engine_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$engine_app/Contents/Info.plist")
          engine_binary="$engine_app/Contents/MacOS/$engine_name"
          test -x "$engine_binary"
          lipo -verify_arch "${{ matrix.goarch == 'arm64' && 'arm64' || 'x86_64' }}" "$engine_binary"
          engine_sha=$(shasum -a 256 "$engine_binary" | cut -d' ' -f1)
          echo "ENGINE_APP=$engine_app" >> "$GITHUB_ENV"
          echo "ENGINE_BINARY=$engine_binary" >> "$GITHUB_ENV"
          echo "ENGINE_SHA256=$engine_sha" >> "$GITHUB_ENV"

      - name: Run Go launcher tests
        run: |
          cd installer/viewer && go test -tags ci ./...
          cd ../configurator && go test -tags ci ./...

      - name: Build RelaisDesk Viewer macOS Launcher
        run: |
          cd installer/viewer
          export GOOS=darwin
          export GOARCH=${{ matrix.goarch }}
          # Fyne needs cgo; keep the requested architecture explicit.
          export CGO_ENABLED=1
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            export CC="clang -arch x86_64"
            export CXX="clang++ -arch x86_64"
          fi
          go build -trimpath -ldflags "-s -w -X main.APIURL=https://api.relaisdesk.fr -X main.RUSTDESK_EXPECTED_SHA256=$ENGINE_SHA256" -o RelaisDesk_Viewer_mac .

      - name: Build RelaisDesk Technicien macOS Launcher
        run: |
          cd installer/configurator
          export GOOS=darwin
          export GOARCH=${{ matrix.goarch }}
          export CGO_ENABLED=1
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            export CC="clang -arch x86_64"
            export CXX="clang++ -arch x86_64"
          fi
          go build -trimpath -ldflags "-s -w -X main.APIURL=https://api.relaisdesk.fr -X main.RUSTDESK_EXPECTED_SHA256=$ENGINE_SHA256" -o RelaisDesk_Technicien_mac .

      - name: Package RelaisDesk Viewer (.app & .dmg)
        run: |
          mkdir -p build/RelaisDesk.app/Contents/MacOS
          mkdir -p build/RelaisDesk.app/Contents/Resources
          cp installer/viewer/RelaisDesk_Viewer_mac build/RelaisDesk.app/Contents/MacOS/RelaisDesk
          chmod +x build/RelaisDesk.app/Contents/MacOS/RelaisDesk
          
          cp "$ENGINE_APP/Contents/Info.plist" build/RelaisDesk.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable RelaisDesk' build/RelaisDesk.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier fr.relaisdesk.viewer' build/RelaisDesk.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.0.0' build/RelaisDesk.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1.0.0' build/RelaisDesk.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :LSMinimumSystemVersion ${{ matrix.min_macos }}' build/RelaisDesk.app/Contents/Info.plist
          cp -R "$ENGINE_APP/Contents/Frameworks" build/RelaisDesk.app/Contents/
          cp -R "$ENGINE_APP/Contents/Resources/." build/RelaisDesk.app/Contents/Resources/
          cp "$ENGINE_BINARY" build/RelaisDesk.app/Contents/MacOS/rustdesk
          test "$(shasum -a 256 build/RelaisDesk.app/Contents/MacOS/rustdesk | cut -d' ' -f1)" = "$ENGINE_SHA256"
          lipo -verify_arch "${{ matrix.goarch == 'arm64' && 'arm64' || 'x86_64' }}" build/RelaisDesk.app/Contents/MacOS/RelaisDesk
          codesign --force --sign - build/RelaisDesk.app
          codesign --verify --deep --strict build/RelaisDesk.app
          test "$(shasum -a 256 build/RelaisDesk.app/Contents/MacOS/rustdesk | cut -d' ' -f1)" = "$ENGINE_SHA256"

          # Création du DMG Viewer
          create-dmg \
            --volname "RelaisDesk Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 420 185 \
            "RelaisDesk_Mac${{ matrix.dmg_suffix }}.dmg" \
            "build/RelaisDesk.app"

      - name: Package RelaisDesk Technicien (.app & .dmg)
        run: |
          mkdir -p build_tech/RelaisDesk_Technicien.app/Contents/MacOS
          mkdir -p build_tech/RelaisDesk_Technicien.app/Contents/Resources
          cp installer/configurator/RelaisDesk_Technicien_mac build_tech/RelaisDesk_Technicien.app/Contents/MacOS/RelaisDesk_Technicien
          chmod +x build_tech/RelaisDesk_Technicien.app/Contents/MacOS/RelaisDesk_Technicien

          cp "$ENGINE_APP/Contents/Info.plist" build_tech/RelaisDesk_Technicien.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable RelaisDesk_Technicien' build_tech/RelaisDesk_Technicien.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier fr.relaisdesk.technicien' build_tech/RelaisDesk_Technicien.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.0.0' build_tech/RelaisDesk_Technicien.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1.0.0' build_tech/RelaisDesk_Technicien.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :LSMinimumSystemVersion ${{ matrix.min_macos }}' build_tech/RelaisDesk_Technicien.app/Contents/Info.plist
          cp -R "$ENGINE_APP/Contents/Frameworks" build_tech/RelaisDesk_Technicien.app/Contents/
          cp -R "$ENGINE_APP/Contents/Resources/." build_tech/RelaisDesk_Technicien.app/Contents/Resources/
          cp "$ENGINE_BINARY" build_tech/RelaisDesk_Technicien.app/Contents/MacOS/rustdesk
          test "$(shasum -a 256 build_tech/RelaisDesk_Technicien.app/Contents/MacOS/rustdesk | cut -d' ' -f1)" = "$ENGINE_SHA256"
          lipo -verify_arch "${{ matrix.goarch == 'arm64' && 'arm64' || 'x86_64' }}" build_tech/RelaisDesk_Technicien.app/Contents/MacOS/RelaisDesk_Technicien
          codesign --force --sign - build_tech/RelaisDesk_Technicien.app
          codesign --verify --deep --strict build_tech/RelaisDesk_Technicien.app
          test "$(shasum -a 256 build_tech/RelaisDesk_Technicien.app/Contents/MacOS/rustdesk | cut -d' ' -f1)" = "$ENGINE_SHA256"

          # Création du DMG Technicien
          create-dmg \
            --volname "RelaisDesk Technicien" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 420 185 \
            "RelaisDesk_Technicien_Mac${{ matrix.dmg_suffix }}.dmg" \
            "build_tech/RelaisDesk_Technicien.app"

      - name: Compute SHA-256 Checksums
        run: |
          shasum -a 256 RelaisDesk_Mac*.dmg RelaisDesk_Technicien_Mac*.dmg > SHA256SUMS-macos-${{ matrix.goarch }}.txt
          cat SHA256SUMS-macos-${{ matrix.goarch }}.txt

      - name: Verify DMG artifacts (fail on missing/identical)
        run: |
          set -e
          ls -la RelaisDesk_Mac*.dmg RelaisDesk_Technicien_Mac*.dmg
          test -f "RelaisDesk_Mac${{ matrix.dmg_suffix }}.dmg"
          test -f "RelaisDesk_Technicien_Mac${{ matrix.dmg_suffix }}.dmg"
          A=$(shasum -a 256 "RelaisDesk_Mac${{ matrix.dmg_suffix }}.dmg" | cut -d' ' -f1)
          B=$(shasum -a 256 "RelaisDesk_Technicien_Mac${{ matrix.dmg_suffix }}.dmg" | cut -d' ' -f1)
          if [ "$A" = "$B" ]; then echo "FATAL: viewer and technicien DMGs are identical"; exit 1; fi
          echo "DMGs OK: viewer=$A technicien=$B"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: relaisdesk-macos-dmg-${{ matrix.goarch }}
          path: |
            RelaisDesk_Mac*.dmg
            RelaisDesk_Technicien_Mac*.dmg
            SHA256SUMS-macos-${{ matrix.goarch }}.txt

  package-compatibility:
    if: ${{ inputs.repackage_run_id != '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/repackage-macos-compatibility.yml
    with:
      run_id: ${{ inputs.repackage_run_id }}
