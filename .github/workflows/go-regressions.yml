name: Go security and regressions

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-regressions-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: '**/go.sum'
      - name: Test and vet all Go modules
        shell: bash
        run: |
          for module in database api dashboard_admin installer/viewer installer/configurator installer/debpack keygen tests; do
            echo "::group::$module"
            (cd "$module" && go test -tags ci ./... && go vet -tags ci ./...)
            echo '::endgroup::'
          done
      - name: Check website source consistency
        run: |
          node scripts/legal-checks.mjs --sources-only
          node scripts/fleet-legal-checks.mjs

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: '**/go.sum'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Audit all Go modules
        shell: bash
        run: |
          for module in database api dashboard_admin installer/viewer installer/configurator installer/debpack keygen tests; do
            echo "::group::$module"
            (cd "$module" && govulncheck -tags ci ./...)
            echo '::endgroup::'
          done
