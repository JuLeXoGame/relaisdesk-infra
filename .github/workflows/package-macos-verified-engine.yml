name: Package verified macOS engine 1.0.0

on:
  workflow_dispatch:
  push:
    branches: [codex/security-perf-1-0-20261023]
    paths:
      - .github/workflows/package-macos-verified-engine.yml
      - scripts/package-macos-verified-engine.sh
      - installer/viewer/rustdesk_darwin.go
      - installer/configurator/rustdesk_darwin.go

permissions:
  contents: read
  actions: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            minimum: '12.3'
            viewer_dmg: RelaisDesk_Mac.dmg
            viewer_sha: 11bbe50f397e83a3fa74fd5b1deb48c27d1abaf7a3119b4fc2ccb609dd19a16d
            engine_sha: be486bb93e77f91d1400978e5e9841da396e2529f3f209c5a3c8287055ca9e37
          - arch: amd64
            runner: macos-15-intel
            minimum: '12.0'
            viewer_dmg: RelaisDesk_Mac_Intel.dmg
            viewer_sha: d5cf83000ebf9c923c910988208501e02b3754dfed4ec8a5856cdce935b743bb
            engine_sha: 7c7a7ca074b7130a5aad5f5364898fe20cc9687d243c8b77a666929e4f1968b8
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minimum }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            installer/viewer/go.sum
            installer/configurator/go.sum
      - name: Test launcher code
        run: |
          (cd installer/viewer && go test -tags ci ./... && go vet -tags ci ./...)
          (cd installer/configurator && go test -tags ci ./... && go vet -tags ci ./...)
      - name: Retrieve the verified engine from the released viewer
        env:
          GH_TOKEN: ${{ github.token }}
          VIEWER_DMG: ${{ matrix.viewer_dmg }}
          VIEWER_SHA: ${{ matrix.viewer_sha }}
          ENGINE_SHA: ${{ matrix.engine_sha }}
        run: |
          set -euo pipefail
          source_run=40838090440
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run" --jq '.head_sha + ":" + .conclusion')" = 0d7a40722967dd3b493af1799e03e171588f3d31:success
          gh run download "$source_run" --repo "$GITHUB_REPOSITORY" --name "relaisdesk-macos-dmg-$BUILD_ARCH" --dir "$RUNNER_TEMP/verified-input"
          dmg="$RUNNER_TEMP/verified-input/$VIEWER_DMG"
          test "$(shasum -a 256 "$dmg" | cut -d' ' -f1)" = "$VIEWER_SHA"
          mount_dir="$RUNNER_TEMP/verified-mount"
          mkdir "$mount_dir"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir" || true' EXIT
          engine_app="$RUNNER_TEMP/verified-engine/RelaisDeskEngine.app"
          ditto "$mount_dir/RelaisDesk.app/Contents/Helpers/RelaisDeskEngine.app" "$engine_app"
          test "$(shasum -a 256 "$engine_app/Contents/MacOS/RelaisDesk" | cut -d' ' -f1)" = "$ENGINE_SHA"
          codesign --verify --deep --strict "$engine_app"
          echo "ENGINE_APP=$engine_app" >> "$GITHUB_ENV"
          echo "ENGINE_SHA256=$ENGINE_SHA" >> "$GITHUB_ENV"
      - name: Build and verify complete applications and disk images
        run: bash scripts/package-macos-verified-engine.sh
      - uses: actions/upload-artifact@v4
        with:
          name: relaisdesk-macos-dmg-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            RelaisDesk_Mac*.dmg
            RelaisDesk_Technicien_Mac*.dmg
            SHA256SUMS-macos-${{ matrix.arch }}.txt
